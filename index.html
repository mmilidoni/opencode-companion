<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Companion for OpenCode</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        font-size: 16px;
        color: #1f2328;
        background: #f6f8fa;
        display: flex;
        justify-content: center;
        padding: 64px 16px;
      }
      main {
        max-width: 560px;
        background: #ffffff;
        border: 1px solid #d0d7de;
        border-radius: 10px;
        padding: 32px;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 8px;
      }
      p {
        line-height: 1.5;
        margin: 8px 0;
      }
      ul {
        margin: 8px 0;
        padding-left: 20px;
      }
      a {
        color: #1f6feb;
      }
      .badges {
        margin: 16px 0;
      }
      .badges a {
        display: inline-block;
        margin: 0 8px 8px 0;
        vertical-align: middle;
      }
      .muted {
        color: #6e7781;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Companion for OpenCode</h1>
      <p>
        A browser extension that sends selected text and page content from any
        website into your local <a href="https://opencode.ai">opencode</a>
        agent, then lets you chat with it in a side panel. Unofficial and
        open-source.
      </p>
      <p class="badges">
        <a href="https://chromewebstore.google.com/detail/companion-for-opencode/ignkbkhhfpbpakdehejolokfdedcokjm"><img src="https://developer.chrome.com/static/docs/webstore/branding/image/mPGKYBIR2uCP0ApchDXE.png" alt="Available in the Chrome Web Store" height="58" /></a>
        <a href="https://addons.mozilla.org/firefox/addon/companion-for-opencode/"><img src="https://blog.mozilla.org/addons/files/2015/11/get-the-addon.png" alt="Get the Add-on for Firefox" height="58" /></a>
      </p>
      <ul>
        <li><a href="https://github.com/mmilidoni/opencode-companion">Source code</a></li>
        <li><a href="PRIVACY.html">Privacy policy</a></li>
      </ul>
      <p class="muted">Not affiliated with the opencode project.</p>
    </main>
  </body>
</html>

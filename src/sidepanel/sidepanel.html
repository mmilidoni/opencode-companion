<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OpenCode Sessions</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="topbar">
      <span id="conn-dot" class="conn-dot" data-state="unknown"></span>
      <span id="conn-text">Connecting…</span>
      <button id="delete-session" class="btn-ghost danger" disabled>Delete</button>
      <button id="delete-all" class="btn-ghost danger" disabled>Delete all</button>
      <button id="new-session" class="btn-ghost">New</button>
    </header>

    <select id="session-select" class="session-select" aria-label="Sessions"></select>

    <main id="thread" class="thread">
      <div id="thread-empty" class="empty">Select a session to view the conversation.</div>
      <div id="messages" class="messages" hidden></div>
    </main>

    <footer class="composer">
      <div id="draft-preview" class="draft-preview" hidden>
        <span id="draft-label" class="draft-label"></span>
        <span id="draft-text" class="draft-text"></span>
        <button id="draft-dismiss" type="button" class="btn-ghost draft-dismiss" aria-label="Discard capture">✕</button>
      </div>
      <textarea id="prompt" rows="2" placeholder="Message opencode…" spellcheck="false"></textarea>
      <div class="composer-row">
        <select id="command-select" class="command-select" aria-label="Slash command">
          <option value="">Commands…</option>
        </select>
        <input id="command-args" class="command-args" type="text" placeholder="Arguments" spellcheck="false" />
        <button id="run-command" class="btn-ghost" disabled>Run</button>
      </div>
      <div class="composer-actions">
        <label for="model-select" class="model-label">Model</label>
        <select id="model-select" aria-label="Model"></select>
        <button id="abort" class="btn-ghost" disabled>Abort</button>
        <button id="send" disabled>Send</button>
      </div>
    </footer>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>

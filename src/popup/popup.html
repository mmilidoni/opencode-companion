<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Companion for OpenCode</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="status-row">
      <span id="status-dot" class="dot" data-state="unknown"></span>
      <span id="status-text">Checking…</span>
    </header>

    <form id="settings-form">
      <label for="server-url">Server URL</label>
      <input id="server-url" type="url" spellcheck="false" placeholder="http://localhost:4096" required />

      <label for="server-password">Password</label>
      <input id="server-password" type="password" autocomplete="off" spellcheck="false" />

      <label for="delivery-mode">Send to</label>
      <select id="delivery-mode">
        <option value="headless">New opencode session</option>
        <option value="tui">Open TUI prompt</option>
      </select>

      <div class="actions">
        <button type="button" id="test-connection">Test connection</button>
        <button type="submit">Save</button>
      </div>

      <p id="status-detail" class="detail" hidden></p>
    </form>

    <button type="button" id="open-panel" class="open-panel">Open side panel</button>

    <script type="module" src="popup.js"></script>
  </body>
</html>
